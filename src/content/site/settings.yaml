bio: >
  Nací en el barrio de Caballito (CABA) el 28 de noviembre de 1965.
  Soy artista visual de alma con formación autodidacta y académica
  con estudios en Arquitectura y Psicología.
  Mi práctica artística nace del cruce entre el arte y lo simbólico.
  A lo largo de los años, fui explorando diversas disciplinas —desde el psicoanálisis
  y la historia del arte hasta la mitología y las teorías del símbolo— que hoy nutren
  una obra atravesada por el imaginario arquetípico y la búsqueda de sentidos ocultos.
  Entre las principales fuentes de inspiración encuentro en el Surrealismo y lo metafísico
  una gran influencia: una forma de ver la materia no como un fin en sí mismo,
  sino un lenguaje para representar los paisajes de la conciencia. En ese camino,
  mi arte busca revelar los significados del alma y el inconsciente en lo cotidiano.
  En síntesis, mi obra es un mapa simbólico de búsqueda personal y colectiva.
  Un intento de transformar el arte en un espacio espiritual,
  una guía poética hacia la elevación de la conciencia.
